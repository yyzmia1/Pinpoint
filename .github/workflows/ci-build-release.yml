name: Android CI & Nightly Pre-release

# Manual trigger only so normal git pushes return immediately without slow cloud queues
on:
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also compile R8 Release APK (slower)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ci-main
  cancel-in-progress: true

jobs:
  build-and-prerelease:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode optional release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            mkdir -p app/keystore
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/keystore/pocket-release.jks
          fi

      - name: Run unit tests and assemble fast Debug test APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain

      - name: Assemble Release APK (on manual request)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release == true }}
        env:
          POCKET_KEYSTORE_PASS: ${{ secrets.POCKET_KEYSTORE_PASS }}
          POCKET_KEY_ALIAS: ${{ secrets.POCKET_KEY_ALIAS }}
          POCKET_KEY_PASS: ${{ secrets.POCKET_KEY_PASS }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Package test APKs
        id: pkg
        run: |
          VERSION_NAME="$(git describe --tags --match 'v*' --always | sed 's/^v//')"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit_count=${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/PocketEverything-${VERSION_NAME}-debug.apk"

          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/PocketEverything-${VERSION_NAME}-release.apk"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
            "$APKSIGNER" sign \
              --ks "$HOME/.android/debug.keystore" \
              --ks-pass pass:android \
              --key-pass pass:android \
              --ks-key-alias androiddebugkey \
              --out "dist/PocketEverything-${VERSION_NAME}-release-test.apk" \
              app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          ls -lh dist

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PocketEverything-${{ steps.pkg.outputs.version_name }}
          path: dist/*.apk
          retention-days: 30

      - name: Publish rolling test pre-release (nightly)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME="${{ steps.pkg.outputs.version_name }}"
          COMMIT_COUNT="${{ steps.pkg.outputs.commit_count }}"
          SHORT_SHA="${{ steps.pkg.outputs.short_sha }}"

          {
            printf '%s\n' "## 测试版自动构建 (${VERSION_NAME})"
            printf '%s\n' ""
            printf '%s\n' "- **构建号**：#${COMMIT_COUNT}"
            printf '%s\n' "- **提交**：\`${SHORT_SHA}\`"
            printf '%s\n' "- **最近变更**："
            printf '%s\n' ""
            git log -1 --pretty=%B
            printf '%s\n' ""
            printf '%s\n' "> 注：此为 \`main\` 分支轻量测试版（Debug 包可与正式版并存安装；正式发布请见稳定 Release）。"
          } > dist/release-notes.md

          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
          gh release create nightly dist/*.apk \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "PocketEverything 测试版 · ${VERSION_NAME} (#${COMMIT_COUNT})" \
            --notes-file dist/release-notes.md
