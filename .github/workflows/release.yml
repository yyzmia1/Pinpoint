name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag to release (leave blank to use current tag/HEAD)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout requested tag (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
        run: |
          git fetch --tags --force
          git checkout "refs/tags/${{ inputs.tag }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            TAG_NAME="${GITHUB_REF_NAME:-}"
            if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -n "$TAG_NAME" ] && \
               gh release view "$TAG_NAME" --json assets --jq '.assets | length' 2>/dev/null | grep -vq '^0$'; then
              echo "Release assets for ${TAG_NAME} already exist and RELEASE_KEYSTORE_BASE64 is unset; skipping CI build."
              echo "skip_build=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret. Configure signing secrets in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          mkdir -p app/keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > app/keystore/pocket-release.jks

      - name: Verify, test, and build signed Release & Debug APKs
        if: steps.keystore.outputs.skip_build != 'true'
        env:
          POCKET_KEYSTORE_PASS: ${{ secrets.POCKET_KEYSTORE_PASS }}
          POCKET_KEY_ALIAS: ${{ secrets.POCKET_KEY_ALIAS }}
          POCKET_KEY_PASS: ${{ secrets.POCKET_KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --console=plain

      - name: Verify APK metadata and signatures
        if: steps.keystore.outputs.skip_build != 'true'
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          REL_APK="app/build/outputs/apk/release/app-release.apk"
          DBG_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$REL_APK"
          "$BUILD_TOOLS/aapt2" dump badging "$REL_APK" | grep -E "^package:|^application-label:"
          "$BUILD_TOOLS/apksigner" verify "$REL_APK"
          "$BUILD_TOOLS/apksigner" verify "$DBG_APK"

      - name: Package release assets
        if: steps.keystore.outputs.skip_build != 'true'
        id: pkg
        run: |
          VERSION_NAME="$(git describe --tags --match 'v*' --always | sed 's/^v//')"
          TAG_NAME="v${VERSION_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Pinpoint-${VERSION_NAME}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Pinpoint-${VERSION_NAME}-debug.apk"
          ls -lh dist

      - name: Upload release APK artifacts
        if: steps.keystore.outputs.skip_build != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pinpoint-release-${{ steps.pkg.outputs.version_name }}
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.keystore.outputs.skip_build != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.pkg.outputs.tag_name }}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/*.apk --clobber
          else
            gh release create "$TAG_NAME" dist/*.apk \
              --title "Pinpoint ${TAG_NAME}" \
              --generate-notes
          fi

      - name: Clean up decoded keystore
        if: always()
        run: rm -f app/keystore/pocket-release.jks
