name: Android CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests, Lint, and assemble Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain

      - name: Stage Debug APK artifact
        id: pkg
        run: |
          VERSION_NAME="$(git describe --tags --match 'v*' --always | sed 's/^v//')"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Pinpoint-${VERSION_NAME}-debug.apk"
          ls -lh dist

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinpoint-ci-debug-${{ steps.pkg.outputs.version_name }}
          path: dist/*.apk
          retention-days: 14

      - name: Upload Lint report on failure or completion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinpoint-lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: ignore
