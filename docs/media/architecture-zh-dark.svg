  <text x="48" y="436" class="badge-txt" fill="#E3B341">CjkTokenizer 中文分词 · AST 二次校验</text>
  <text x="48" y="453" class="card-sub">WAL 读写分离 · Zlib 压缩正文 · GROUP BY 聚合</text>
  <rect x="488" y="398" width="438" height="66" rx="9" fill="#2E1619" stroke="#F85149" stroke-width="1.3" />
  <text x="502" y="418" class="card-title">三级权限文件系统与安全删除</text>
  <text x="502" y="436" class="badge-txt" fill="#FFA198">普通 / Shizuku / Root · 双重系统目录保护</text>
  <text x="502" y="453" class="card-sub">PrivilegedTreeWalker + PFD 管道流式传输</text>
