      .layer-lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.4px; fill: #8B949E; }
      .card-title { font-size: 13.5px; font-weight: 700; fill: #F0F6FC; }
      .card-sub { font-size: 11px; fill: #8B949E; }
      .badge-txt { font-size: 10.5px; font-weight: 600; }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="492" rx="16" fill="#0D1117" />
  <rect x="20" y="16" width="920" height="94" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1" />
  <text x="36" y="36" class="layer-lbl">界面交互层 · Jetpack Compose (Material 3)</text>
  <rect x="34" y="46" width="214" height="52" rx="9" fill="#1C2330" stroke="#388BFD" stroke-width="1.2" />
