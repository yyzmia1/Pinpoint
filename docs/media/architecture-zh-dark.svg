  <line x1="440" y1="340" x2="360" y2="364" stroke="#58A6FF" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="520" y1="340" x2="600" y2="364" stroke="#58A6FF" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="760" y1="340" x2="760" y2="364" stroke="#58A6FF" stroke-width="1.8" marker-end="url(#arrow)" />
